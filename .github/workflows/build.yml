name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: admin-panel
          path: ${{ steps.build.outputs.build-output }}
